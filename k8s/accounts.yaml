apiVersion: v1
kind: Service
metadata:
  name: accounts
  namespace: book-rec
spec:
  selector:
    app: accounts
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts
  namespace: book-rec
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accounts
  template:
    metadata:
      labels:
        app: accounts
    spec:
      # Create the accounts schema + tables before the app serves (idempotent create_all; retries
      # until Postgres is reachable).
      initContainers:
        - name: init-db
          image: book-recommendation-accounts:latest
          imagePullPolicy: IfNotPresent
          command: ["uv", "run", "--no-dev", "python", "-c", "from accounts.db import init_db; init_db()"]
          envFrom:
            - configMapRef:
                name: app-config
      containers:
        - name: accounts
          image: book-recommendation-accounts:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: jwt-keys
              mountPath: /keys
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys
