apiVersion: v1
kind: Service
metadata:
  name: agent
  namespace: book-rec
spec:
  selector:
    app: agent
  ports:
    - port: 2024
      targetPort: 2024
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
  namespace: book-rec
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agent
  template:
    metadata:
      labels:
        app: agent
    spec:
      # Create the agent's domain schema (book_agent) + tables before serving. The LangGraph Server
      # itself self-migrates the `langgraph` database on startup.
      initContainers:
        - name: init-db
          image: book-recommendation-agent:latest
          imagePullPolicy: IfNotPresent
          # The langgraph-api image's ENTRYPOINT starts the server and scripts/ is excluded from the
          # image, so override both and call agent.db.init_db() directly.
          command: ["python", "-c", "from agent.db import init_db; init_db()"]
          envFrom:
            - configMapRef:
                name: app-config
      containers:
        - name: agent
          image: book-recommendation-agent:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          ports:
            - containerPort: 2024
          readinessProbe:
            httpGet:
              path: /ok
              port: 2024
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ok
              port: 2024
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
