apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The `jwt-keys` and `app-secrets` Secrets are created out-of-band (make k8s-keys / k8s-secrets)
# so no credentials live in git — they are intentionally NOT listed here.
resources:
  - namespace.yaml
  - configmap-app.yaml
  - postgres.yaml
  - redis.yaml
  - accounts.yaml
  - agent.yaml
  - service.yaml
  - ui.yaml
  - ingress.yaml
