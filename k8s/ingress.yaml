# All browser traffic enters through the UI (nginx), which serves the SPA and reverse-proxies both
# backends under /api/*. So the ingress only needs to route everything to the ui Service.
#
# Assumes an ingress controller (e.g. ingress-nginx). For TLS, add a tls: block and set
# REFRESH_COOKIE_SECURE=true in the app-config ConfigMap.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: book-rec
  namespace: book-rec
  annotations:
    # SSE: don't buffer the chat stream at the ingress layer.
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: book-rec.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 80
