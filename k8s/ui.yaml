apiVersion: v1
kind: Service
metadata:
  name: ui
  namespace: book-rec
spec:
  selector:
    app: ui
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
  namespace: book-rec
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ui
  template:
    metadata:
      labels:
        app: ui
    spec:
      containers:
        - name: ui
          # nginx serves the built SPA only (no API proxy). The browser calls the backends directly
          # by absolute URL, baked at build time via VITE_API_BASE_URL / VITE_CHAT_BASE_URL — set
          # those build args to the externally-reachable accounts/service URLs for your cluster.
          image: book-recommendation-ui:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
